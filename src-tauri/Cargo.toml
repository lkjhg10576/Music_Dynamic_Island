[package]
name = "netspeed-dynamic"
version = "0.6.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
name = "netspeed_dynamic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 添加 sysinfo 库来监控网络
sysinfo = "0.30"
windows-sys = { version = "0.59", features = [
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_System_Registry",
    "Win32_Graphics_Printing",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_Time",
    "Win32_UI_Shell",
    # CreateEventW（print_utils.rs）参数含 SECURITY_ATTRIBUTES，必须启用 Security feature
    "Win32_Security",
    # 剪贴板历史：OpenClipboard / SetClipboardData / GetClipboardSequenceNumber 等
    "Win32_System_DataExchange",
    # 剪贴板历史：GlobalAlloc / GlobalLock（读写剪贴板内存块）
    "Win32_System_Memory",
    # 剪贴板历史：WideCharToMultiByte（CF_TEXT ANSI 转换）
    "Win32_Globalization",
] }
# 锁屏检测 / MessageBeep：OpenInputDesktop/CloseDesktop/MessageBeep 在 windows-sys 0.59
# 的 win32metadata 中已被移除（docs.rs 0.59.0 查证不存在），按项目规范这些 API 一律走 winapi 0.3。
# 剪贴板写回的 GlobalFree 同样不在 windows-sys 0.59 的 Memory 模块（rustc E0432 实证），
# 一并走 winapi::um::winbase。
winapi = { version = "0.3", features = ["winuser", "winbase"] }
tauri-plugin-single-instance = "2.0.0" # 根据你的Tauri2版本调整具体小版本
tokio = { version = "1", features = ["rt", "sync", "time", "net"] }
urlencoding = "2.1.3"
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
once_cell = "1"
base64 = "0.22"
rand = "0.8"
windows = { version = "0.58.0", features = [
    "UI_Notifications_Management",
    "UI_Notifications",
    "Foundation",
    "Foundation_Collections",
    "ApplicationModel",
    # F：系统日历只读（AppointmentManager / AppointmentStore / Appointment）
    "ApplicationModel_Appointments",
    "implement",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Media_Control",
    "Storage_Streams",
    "Win32_System_Power",
    "Win32_Networking_NetworkListManager",
    # 剪贴板历史：WIC 解码 PNG / 生成 JPEG 缩略图
    "Win32_Graphics_Imaging",
    # 剪贴板历史：IWICBitmapEncoder::CreateNewFrame / IWICBitmapFrameEncode::Initialize 的
    # IPropertyBag2 参数位于 Win32::System::Com::StructuredStorage 模块，缺此 feature 时
    # 上述方法会被 cfg 门控掉（v0.58.0 源码查证）
    "Win32_System_Com_StructuredStorage",
] }
cpal = "0.15"
rustfft = "6.2"

# Fix Dependabot: glib unsoundness GHSA - force 0.20+ (patched)
# 仅在非 Windows 平台启用：Linux/macOS 上 tao 通过 gtk 依赖 glib，需要钉到 0.20+ 修复安全告警；
# Windows 走 Win32 API，不需要原生 glib，且构建机无 pkg-config，必须排除，否则 tauri build 失败。
[target.'cfg(not(target_os = "windows"))'.dependencies]
glib = "0.20"
